[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "services"
version = "0.1.0"
description = "REST APIs (FastAPI), each with an MCP server so agents can use them as tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "fastmcp==4.0.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
calculator-api = "calculator.api.main:main"
calculator-mcp = "calculator.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "calculator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
