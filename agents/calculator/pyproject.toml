[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calculator-agent"
version = "0.1.0"
description = "A small template for learning MCP tools -> LLM agent -> A2A, with memory, auth and security."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "starlette",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "fastmcp==4.0.10",
    "a2a-sdk[http-server]>=1.1.5,<2",
    "openai>=1.99",
    "pydantic-settings>=2.6",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "fakeredis>=2.26", "ruff>=0.6"]

[project.scripts]
agent = "agent.cli:main"
agent-a2a = "agent.a2a.server:main"

[tool.hatch.build.targets.wheel]
packages = ["common", "agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 140
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

